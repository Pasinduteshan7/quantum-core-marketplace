services:
  # ════════════════════════════════════════════════════════════════════
  # 🐘 PostgreSQL Database (Persistent Data Store)
  # ════════════════════════════════════════════════════════════════════
  postgres:
    image: postgres:16-alpine
    container_name: quantumcore_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quantumcore_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5433:5432" # Exposed on 5433 to match existing local conventions
    volumes:
      - quantum_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-quantumcore_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - quantum_network

  # ════════════════════════════════════════════════════════════════════
  # ☕ Spring Boot 3 Backend (REST API + STOMP WebSockets :8080)
  # ════════════════════════════════════════════════════════════════════
  backend:
    build:
      context: ./backend-springboot
      dockerfile: Dockerfile
    container_name: quantumcore_springboot
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-quantumcore_db}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_placeholder}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_placeholder}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - quantum_network

  # ════════════════════════════════════════════════════════════════════
  # ⚛️ Next.js 15 Frontend (Standalone Mode :3000)
  # ════════════════════════════════════════════════════════════════════
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080/api
    container_name: quantumcore_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
    depends_on:
      - backend
    networks:
      - quantum_network

volumes:
  quantum_pg_data:
    name: quantum_pg_data

networks:
  quantum_network:
    name: quantum_network
    driver: bridge

