server:
  port: 8080

spring:
  application:
    name: quantum-core-backend

  datasource:
    url: jdbc:postgresql://localhost:5433/quantumcore_db
    username: postgres
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # 'update': Automatically creates tables in PostgreSQL to match our Java @Entity classes
      ddl-auto: update
    # 'show-sql: true' prints the exact SQL queries generated by Hibernate to the console
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
